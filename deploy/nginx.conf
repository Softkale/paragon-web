# /etc/nginx/sites-available/paragon  (luego: ln -s a sites-enabled y recargar nginx)
# Si el puerto 4000 está ocupado, PARAGON usa otro y deploy/sync-nginx-port.sh ajusta la línea "proxy_pass" solo.
# Cambia paragon.tudominio.com por tu dominio. Para HTTPS ejecuta después: sudo certbot --nginx -d paragon.tudominio.com
server {
    listen 80;
    listen [::]:80;
    server_name paragon.tudominio.com;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
